name: Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django checks and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: server
      - run: python manage.py check
        working-directory: server
      - run: python manage.py test djangoapp
        working-directory: server

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: server/frontend
      - run: npm run build
        working-directory: server/frontend

  data-api:
    name: Node API syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: node --check app.js
        working-directory: server/database
