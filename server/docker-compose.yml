services:
  mongo_db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  data_api:
    build: ./database
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo_db:27017/
      PORT: 3030
    depends_on:
      mongo_db:
        condition: service_healthy

  sentiment:
    build: ./djangoapp/microservices
    restart: unless-stopped
    expose:
      - "5050"

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-before-public-deployment}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      backend_url: http://data_api:3030
      sentiment_analyzer_url: http://sentiment:5050/
    depends_on:
      - data_api
      - sentiment

volumes:
  mongo_data:
