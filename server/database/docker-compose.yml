services:
  mongo_db:
    image: mongo:7
    container_name: capstone-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: capstone-dealership-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      MONGO_URL: mongodb://mongo_db:27017/
      PORT: 3030
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data:
